<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Offline — InsuroX</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;text-align:center}
    main{max-width:340px}
    img{width:72px;height:72px;margin-bottom:16px}
    h1{font-size:20px;margin:0 0 8px}
    p{margin:0 0 20px;color:#94a3b8;line-height:1.5;font-size:14px}
    button{background:#2563eb;color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:15px;font-weight:600}
  </style>
</head>
<body>
  <main>
    <img src="/pwa-192.png" alt="" />
    <h1>You're offline</h1>
    <p>InsuroX needs a connection to load your latest data. Check your network and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
